name: daily-boot

# Re-renders the terminal (live uptime + repo count), the streak card, the
# typing line and today's fortune, then commits only if something changed.
# Runs every 3 hours so the streak card stays current through the day.
on:
  schedule:
    - cron: "5 */3 * * *" # every 3h, first run 00:05 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/daily-boot.yml"]

permissions:
  contents: write

concurrency:
  group: daily-boot
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build profile
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: your own PAT (classic, scopes `repo` + `read:user`) so the
          # streak card counts private contributions. Unset = public view.
          STREAK_TOKEN: ${{ secrets.STREAK_TOKEN }}

      - name: Commit changes
        run: |
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed. Going back to sleep."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(boot): refresh profile $(date -u +'%F %H:%M')"
          git push
