name: daily-boot

# Re-renders the terminal (live uptime + repo count), the typing line and
# today's fortune, then commits only if something actually changed.
on:
  schedule:
    - cron: "5 0 * * *" # 00:05 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/daily-boot.yml"]

permissions:
  contents: write

concurrency:
  group: daily-boot
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build profile
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing changed. Going back to sleep."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(boot): daily reboot $(date -u +%F)"
          git push
